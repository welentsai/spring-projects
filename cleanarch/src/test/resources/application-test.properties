# Test profile configuration
spring.application.name=demo-test
# Primary Data Source Configuration for Testing (DB1)
spring.datasource.inline.primary.jdbc-url=jdbc:h2:mem:primarydb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.inline.primary.driver-class-name=org.h2.Driver
spring.datasource.inline.primary.username=sa
spring.datasource.inline.primary.password=password
# Secondary Data Source Configuration for Testing (DB2)
spring.datasource.inline.secondary.jdbc-url=jdbc:h2:mem:secondarydb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.inline.secondary.driver-class-name=org.h2.Driver
spring.datasource.inline.secondary.username=sa
spring.datasource.inline.secondary.password=password
# JPA Test Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
# Disable data.sql for testsF
spring.sql.init.mode=never
# H2 Console (disabled in tests)
spring.h2.console.enabled=false
# Logging configuration for tests
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.demo.usecase.ports.in.impl.FindCitiesUseCaseImpl=INFO
logging.level.com.example.demo.framework.di.dynamicdatasource=DEBUG
