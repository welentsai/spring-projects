spring.application.name=demo
# Primary Data Source Configuration (DB1)
spring.datasource.inline.primary.jdbc-url=jdbc:h2:mem:primarydb
spring.datasource.inline.primary.driver-class-name=org.h2.Driver
spring.datasource.inline.primary.username=sa
spring.datasource.inline.primary.password=password
# Secondary Data Source Configuration (DB2)
spring.datasource.inline.secondary.jdbc-url=jdbc:h2:mem:secondarydb
spring.datasource.inline.secondary.driver-class-name=org.h2.Driver
spring.datasource.inline.secondary.username=sa
spring.datasource.inline.secondary.password=password
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Logging configuration for dynamic data source
logging.level.com.example.demo.usecase.ports.in.impl.FindCitiesUseCaseImpl=INFO
logging.level.com.example.demo.framework.di.dynamicdatasource=DEBUG
logging.pattern.console="%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] [%X{userId}] %logger{36} - %msg%n"
# MinIO Configuration
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=password
minio.bucket-name=videos
# MCP Server (Spring AI) - Streamable HTTP endpoint at /mcp
spring.ai.mcp.server.name=cleanarch-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.instructions=Clean Architecture demo API: query cities from the dual H2 datasource and list videos stored in MinIO.
