# APISIX API Gateways (multi-gateway map config)
apisix.gateways.payment.base-url=https://payment-gw.example.com
apisix.gateways.payment.j1-token=${PAYMENT_J1_TOKEN:change-me}
apisix.gateways.payment.token-endpoint=/auth/token
apisix.gateways.payment.token-ttl-seconds=300

apisix.gateways.inventory.base-url=https://inventory-gw.example.com
apisix.gateways.inventory.j1-token=${INVENTORY_J1_TOKEN:change-me}
apisix.gateways.inventory.token-endpoint=/apisix/token
apisix.gateways.inventory.token-ttl-seconds=600

# Shared Resilience4j settings (applied to all gateways)
apisix.resilience.max-attempts=3
apisix.resilience.timeout-seconds=30
apisix.resilience.failure-rate-threshold=50
apisix.resilience.wait-duration-ms=60000
apisix.resilience.sliding-window-size=10

