repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args: ['--autofix']
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Java formatting using google-java-format
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.12.0
    hooks:
      - id: pretty-format-java
        args: [--autofix]

  # Maven wrapper validation
  - repo: local
    hooks:
      - id: maven-wrapper-permissions
        name: Ensure Maven wrapper is executable
        entry: chmod +x mvnw
        language: system
        files: mvnw$
        pass_filenames: false

  # Maven compile check
  - repo: local
    hooks:
      - id: maven-compile
        name: Maven compile check
        entry: ./mvnw compile -q
        language: system
        pass_filenames: false
        files: \.(java|xml)$

  # Maven test execution
  - repo: local
    hooks:
      - id: maven-test
        name: Maven test execution
        entry: ./mvnw test -q
        language: system
        pass_filenames: false
        files: \.(java|xml)$

  # Security checks for dependencies
  - repo: local
    hooks:
      - id: maven-dependency-check
        name: Maven OWASP dependency check
        entry: ./mvnw org.owasp:dependency-check-maven:check -q
        language: system
        pass_filenames: false
        files: pom\.xml$
        stages: [manual]

  # Code style check with Checkstyle (optional - requires checkstyle plugin in pom.xml)
  - repo: local
    hooks:
      - id: maven-checkstyle
        name: Maven Checkstyle check
        entry: ./mvnw checkstyle:check -q
        language: system
        pass_filenames: false
        files: \.java$
        stages: [manual]

  # SpotBugs static analysis (optional - requires spotbugs plugin in pom.xml)
  - repo: local
    hooks:
      - id: maven-spotbugs
        name: Maven SpotBugs check
        entry: ./mvnw spotbugs:check -q
        language: system
        pass_filenames: false
        files: \.java$
        stages: [manual]
